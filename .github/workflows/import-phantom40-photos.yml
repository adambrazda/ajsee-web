name: Import licensed Phantom 40th photos
on:
  push:
    branches:
      - editorial/phantom40-self-hosted-optimized-photos
    paths:
      - .github/workflows/import-phantom40-photos.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Download and optimize licensed source photos
        run: npm run phantom-40:images
      - name: Commit persistent local WebP photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/uploads/reviews/phantom-of-the-opera-40th-anniversary-reunion/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Import optimized Phantom 40th anniversary photos"
            git push origin HEAD:editorial/phantom40-self-hosted-optimized-photos
          fi
