name: Verify Mary Poppins production release (one-time)

on:
  push:
    branches:
      - verify/mary-poppins-production-2026-11-23
    paths:
      - .github/workflows/mary-poppins-prod-check.yml

permissions:
  contents: read

jobs:
  http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check all 6 routes, canonical SEO, and photo HTTP responses
        shell: bash
        run: |
          python3 - <<'PY'
          import time
          import urllib.request
          import urllib.error
          import re

          root = "https://ajsee.cz"
          slug = "mary-poppins-from-film-to-west-end-stage"
          langs = ["", "en/", "sk/", "de/", "pl/", "hu/"]
          routes = [f"{root}/{lang}reviews/{slug}/" for lang in langs]
          media = [f"{root}/uploads/reviews/{slug}/{name}" for name in [
            "mary-poppins-stefanie-jones-danny-kaan.webp",
            "mary-poppins-step-in-time-danny-kaan.webp",
            "mary-poppins-family-matt-crockett.webp",
          ]]
          headers = {"User-Agent": "Mozilla/5.0 AJSEE-release-smoke/1.0", "Accept": "text/html,image/webp,*/*;q=0.8"}

          def get(url):
            req = urllib.request.Request(url, headers=headers)
            with urllib.request.urlopen(req, timeout=18) as r:
              return r.status, r.url, r.headers.get("Content-Type", ""), r.read()

          for attempt in range(1, 17):
            errors = []
            for u in routes:
              try:
                status, final, mime, data = get(u)
                html = data.decode("utf-8", "replace")
                if status != 200 or "Mary Poppins" not in html or 'rel="canonical"' not in html:
                  errors.append(f"{u}: malformed article status={status} mime={mime} title={('Mary Poppins' in html)} canonical={bool(re.search('rel=canonical', html))}")
                  continue
                if "hreflang=" not in html or "ajsee-review-jsonld" not in html:
                  errors.append(f"{u}: missing language alternates or Article JSON-LD")
                print(f"OK article {u} status={status} bytes={len(data)}")
              except Exception as e:
                errors.append(f"{u}: {type(e).__name__} {e}")
            for u in media:
              try:
                status, final, mime, data = get(u)
                if status != 200 or len(data) < 15000 or data[:4] != b"RIFF" or data[8:12] != b"WEBP":
                  errors.append(f"{u}: image invalid status={status} bytes={len(data)} mime={mime}")
                else:
                  print(f"OK image {u} bytes={len(data)}")
              except Exception as e:
                errors.append(f"{u}: {type(e).__name__} {e}")
            try:
              status, final, mime, data = get(root + "/sitemap.xml")
              if slug.encode("ascii") not in data:
                errors.append(f"Sitemap not yet refreshed with {slug}")
              else:
                print("OK sitemap contains published article")
            except Exception as e:
              errors.append(f"Sitemap: {e}")

            if not errors:
              print("PRODUCTION RELEASE VERIFIED: 6 article locales, 3 self-hosted images, sitemap, canonical/hreflang/JSON-LD")
              raise SystemExit(0)
            print(f"Attempt {attempt}/16 not fully ready: " + " | ".join(errors[:12]), flush=True)
            time.sleep(10)

          print("Production failed independent HTTP QA", flush=True)
          raise SystemExit(1)
          PY
