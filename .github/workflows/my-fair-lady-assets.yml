name: Acquire approved My Fair Lady 2026 press photographs
on:
  push:
    branches: [assets/my-fair-lady-2026-source-download]
    paths: ['.github/workflows/my-fair-lady-assets.yml']
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install --disable-pip-version-check pillow
      - name: Download and optimize authorized official Flickr photography
        shell: bash
        run: |
          python - <<'PY'
          import os, io, time, urllib.request
          from PIL import Image, ImageOps
          root='public/uploads/reviews/my-fair-lady-70-years-musical-legend'
          source_root='assets/editorial/my-fair-lady-70-years-musical-legend'
          os.makedirs(root, exist_ok=True)
          os.makedirs(source_root, exist_ok=True)
          photos=[
            ('eliza-ensemble','55533120736','77a75fe1db'),
            ('eliza-solo','55532107207','8a0156d7c6'),
            ('eliza-higgins','55533509275','f6c05ed358'),
            ('ensemble','55533509230','87517aebb5'),
          ]
          for name,photo_id,secret in photos:
            data=None
            for size in ('b','c','z',''):
              part=('_'+size) if size else ''
              url=f'https://live.staticflickr.com/65535/{photo_id}_{secret}{part}.jpg'
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/122.0 Safari/537.36','Referer':'https://www.flickr.com/','Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8'})
                with urllib.request.urlopen(req,timeout=22) as f:
                  data=f.read()
                  print(name,url,f.status,f.headers.get('Content-Type'),len(data),flush=True)
                image=Image.open(io.BytesIO(data))
                image.load()
                if image.width < 500 or image.height < 450: raise ValueError(f'too small {image.size}')
                break
              except Exception as e:
                data=None
                print('Failed',name,url,str(e)[:200],flush=True)
            if data is None: raise RuntimeError(f'Could not download {name}')
            with open(f'{source_root}/{name}-jeff-busby.jpg','wb') as f:f.write(data)
            im=ImageOps.exif_transpose(Image.open(io.BytesIO(data))).convert('RGB')
            for q in [85,80,75,70]:
              buf=io.BytesIO()
              im.save(buf,'WEBP',quality=q,method=6)
              if buf.tell()<300*1024 or q==70:break
            with open(f'{root}/my-fair-lady-2026-{name}.webp','wb') as f:f.write(buf.getvalue())
            print(name,'dimensions:',im.size,'webp bytes:',buf.tell(),flush=True)
          PY
      - name: Commit approved images into this source branch only
        run: |
          git config user.name "AJSEE asset pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add assets/editorial/my-fair-lady-70-years-musical-legend public/uploads/reviews/my-fair-lady-70-years-musical-legend
          git diff --cached --quiet || git commit -m "Store approved Opera Australia My Fair Lady production photography"
          git push origin HEAD:assets/my-fair-lady-2026-source-download
