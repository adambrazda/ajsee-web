name: Render My Fair Lady 70 Instagram carousel
on:
  push:
    branches: [editorial/my-fair-lady-ig-carousel-20261105]
    paths: ['.github/workflows/my-fair-lady-ig-render.yml', 'scripts/render-my-fair-lady-ig.mjs']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install font families for Czech headings
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation fonts-dejavu-core
      - name: Render seven 1080 x 1350 PNG editorial slides
        run: node scripts/render-my-fair-lady-ig.mjs
      - name: Check exports
        run: |
          test "$(find assets/social/my-fair-lady-70-years-ig -maxdepth 1 -name '*.jpg' | wc -l)" -eq 7
          file assets/social/my-fair-lady-70-years-ig/*.jpg
      - name: Commit media assets to branch
        run: |
          git config user.name "AJSEE carousel renderer"
          git config user.email "actions@users.noreply.github.com"
          git add assets/social/my-fair-lady-70-years-ig/*.png
          git diff --cached --quiet || git commit -m "Render seven Czech My Fair Lady IG carousel panels"
          git push origin HEAD:editorial/my-fair-lady-ig-carousel-20261105
