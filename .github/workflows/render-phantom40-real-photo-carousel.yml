name: Render AJSEE Phantom 40 Carousel from original photographs

on:
  push:
    branches:
      - creative/phantom40-original-photo-carousel
    paths:
      - .github/workflows/render-phantom40-real-photo-carousel.yml
      - creative/phantom40/build_original_photo_carousel.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: creative/phantom40-original-photo-carousel
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer
        run: python -m pip install "Pillow>=11,<13" requests

      - name: Retrieve real Sierra Boggess as Carlotta photograph
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import requests

          name='Sierra-Boggess-as-Carlotta.-Photo-by-Johan-Persson.jpg'
          base='https://www.whatsonstage.com/wp-content/uploads/sites/3/2026/09/'+name
          folder=Path('public/uploads/reviews/phantom-of-the-opera-40th-anniversary-reunion')
          folder.mkdir(parents=True,exist_ok=True)
          filepath=folder/'phantom-40th-sierra-boggess-carlotta.jpg'
          urls=[base+'?w=1200',base+'?w=578',base]
          last=None
          for url in urls:
              try:
                  res=requests.get(url,timeout=25,headers={'User-Agent':'Mozilla/5.0 AJSEE Editorial Photo Renderer','Accept':'image/jpeg,image/webp,image/*;q=0.9'})
                  res.raise_for_status()
                  img=Image.open(BytesIO(res.content))
                  img.load()
                  if img.width < 480 or img.height < 750: raise ValueError(f'Source too small: {img.size}')
                  if img.height <= img.width: raise ValueError('Expected Sierra portrait, got landscape')
                  filepath.write_bytes(res.content)
                  print(f'Authentic Sierra photograph loaded: {img.size}; source: {url}')
                  break
              except Exception as e:
                  print(f'Tried {url}: {e}')
                  last=e
          else:
              raise RuntimeError(f'Unable to retrieve credited Sierra photo: {last}')
          PY

      - name: Render five original-photo slides at 1080x1350
        run: python creative/phantom40/build_original_photo_carousel.py

      - name: Persist final carousel JPEG and ZIP outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f creative-output/phantom40-original-photo-carousel/*.jpg
          git add -f creative-output/phantom40-original-photo-carousel/*.zip
          git add -f public/uploads/reviews/phantom-of-the-opera-40th-anniversary-reunion/phantom-40th-sierra-boggess-carlotta.jpg
          if git diff --cached --quiet; then
            echo "No output changes."
          else
            git commit -m "Render five original-photography AJSEE Phantom 40 carousel slides"
            git push origin HEAD:creative/phantom40-original-photo-carousel
          fi
