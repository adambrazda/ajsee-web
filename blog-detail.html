  <!-- Canonical pro dynamický detail článku: /blog/:slug i fallback /blog-detail?slug=... -->
  <script>
    (function () {
      const origin = 'https://ajsee.cz';
      const params = new URLSearchParams(window.location.search);

      const querySlug = (params.get('slug') || '').trim();
      const pathMatch = window.location.pathname.match(/^\/blog\/([^/?#]+)\/?$/i);

      let slug = querySlug;

      if (!slug && pathMatch && pathMatch[1]) {
        try {
          slug = decodeURIComponent(pathMatch[1]);
        } catch {
          slug = pathMatch[1];
        }
      }

      const canonicalUrl = slug
        ? `${origin}/blog/${encodeURIComponent(slug)}/`
        : `${origin}/blog-detail`;

      function upsertMetaName(name, content) {
        let el = document.querySelector(`meta[name="${name}"]`);
        if (!el) {
          el = document.createElement('meta');
          el.setAttribute('name', name);
          document.head.appendChild(el);
        }
        el.setAttribute('content', content);
      }

      function upsertLink(rel, href) {
        let el = document.querySelector(`link[rel="${rel}"]`);
        if (!el) {
          el = document.createElement('link');
          el.setAttribute('rel', rel);
          document.head.appendChild(el);
        }
        el.setAttribute('href', href);
      }

      function upsertMetaProperty(property, content) {
        let el = document.querySelector(`meta[property="${property}"]`);
        if (!el) {
          el = document.createElement('meta');
          el.setAttribute('property', property);
          document.head.appendChild(el);
        }
        el.setAttribute('content', content);
      }

      upsertMetaName('robots', slug ? 'index, follow' : 'noindex, follow');
      upsertLink('canonical', canonicalUrl);
      upsertMetaProperty('og:url', canonicalUrl);

      if (slug && /^\/blog-detail\/?$/i.test(window.location.pathname)) {
        const nextParams = new URLSearchParams();
        const lang = params.get('lang');

        if (lang) nextParams.set('lang', lang);

        const nextUrl =
          `/blog/${encodeURIComponent(slug)}` +
          (nextParams.toString() ? `?${nextParams.toString()}` : '');

        window.history.replaceState({}, '', nextUrl);
      }
    })();
  </script>

  <!-- Google tag – pouze na HTTPS/produkci -->
  <script>
    (function(){
      const isProdHttps = location.protocol === 'https:' && !/localhost|127\.0\.0\.1|0\.0\.0\.0/i.test(location.hostname);
      if (!isProdHttps) return;
      const s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-K0ZS0D9JLK';
      s.onload = function(){
        window.dataLayer = window.dataLayer || [];
        function gtag(){ dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', 'G-K0ZS0D9JLK');
      };
      document.head.appendChild(s);
    })();
  </script>

  <!-- i18n fallback – jen když hlavní engine ještě nedodal překlady -->
  <script>
    (function(){
      function detectLang(){
        try {
          const qs = new URLSearchParams(location.search);
          return (qs.get('lang') || document.documentElement.lang || 'cs').toLowerCase();
        } catch { return 'cs'; }
      }

      function applyI18nFallback(lang){
        const root = window.translations || null;
        if (!root) return;

        const dict = root[lang] || root;
        const get = (path) => path.split('.').reduce((o,k)=>o?.[k], dict);

        document.querySelectorAll('[data-i18n-key]').forEach(el => {
          const key = el.getAttribute('data-i18n-key');
          const val = get(key);
          if (typeof val === 'string' && val.trim()) el.textContent = val;
        });

        document.querySelectorAll('[data-i18n-content]').forEach(el => {
          const key = el.getAttribute('data-i18n-content');
          const val = get(key);
          if (typeof val === 'string' && val.trim()) el.setAttribute('content', val);
        });

        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
          const key = el.getAttribute('data-i18n-placeholder');
          const val = get(key);
          if (typeof val === 'string' && val.trim()) el.setAttribute('placeholder', val);
        });

        document.querySelectorAll('[data-i18n-aria]').forEach(el => {
          const key = el.getAttribute('data-i18n-aria');
          const val = get(key);
          if (typeof val === 'string' && val.trim()) {
            el.setAttribute('aria-label', val);
            el.setAttribute('title', val);
          }
        });

        document.querySelectorAll('[data-i18n-alt]').forEach(el => {
          const key = el.getAttribute('data-i18n-alt');
          const val = get(key);
          if (typeof val === 'string' && val.trim()) el.setAttribute('alt', val);
        });
      }

      window.addEventListener('DOMContentLoaded', () => {
        const lang = detectLang();
        document.documentElement.lang = lang;

        if (typeof window.applyTranslations === 'function') return;

        setTimeout(() => {
          if (typeof window.applyTranslations === 'function') return;
          applyI18nFallback(lang);
        }, 250);
      });
    })();
  </script>
