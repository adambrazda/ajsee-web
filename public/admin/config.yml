backend:
  name: git-gateway
  branch: main
  base_url: https://ajsee.cz/

site_url: https://ajsee.cz
display_url: https://ajsee.cz

media_folder: "public/uploads"   # kam se uloží soubory v repo
public_folder: "/uploads"        # jak budou dostupné na webu

publish_mode: editorial_workflow
locale: en

# ---------------------------------------------------------
# Kolekce
# ---------------------------------------------------------
collections:
  # —— Index karet pro výpis na blogu ——
  - name: "microguide_index"
    label: "Micro-guides: Index (výpis na blogu)"
    files:
      - name: "list"
        label: "Položky indexu"
        file: "content/microguides/index.json"
        format: json
        editor:
          preview: false
        sortable_fields: ["publishedAt", "slug", "language", "status"]  # ⬅️ přidán publishedAt pro řazení
        fields:
          - label: "Položky"
            name: "items"
            widget: "list"
            label_singular: "Položka"
            summary: "{{fields.publishedAt}} • {{fields.slug}} • {{fields.language}} • {{fields.status}}"
            allow_add: true
            fields:
              - label: "Slug"
                name: "slug"
                widget: "string"
                hint: "např. seating-map"
                pattern: ['^[a-z0-9-]+$', 'pouze malá písmena a pomlčky']
              - label: "Jazyk karty (primární)"
                name: "language"
                widget: "select"
                options: ["cs","en","de","sk","pl","hu"]
                default: "cs"
              - label: "Status"
                name: "status"
                widget: "select"
                options: ["draft", "published"]
                default: "published"
              - label: "Publikováno"
                name: "publishedAt"
                widget: "datetime"
                picker_utc: true
                format: "YYYY-MM-DDTHH:mm:ss[Z]"   # ISO v UTC, bezpečné pro řazení
              - label: "Cover (volitelné)"
                name: "cover"
                widget: "image"
                required: false
                choose_url: true
                hint: "Můžeš vložit URL (např. /images/microguides/slug/cover.webp) nebo nahrát soubor."
              - label: "Titulek (fallback)"
                name: "title"
                widget: "string"
                required: false
                hint: "Použije se, pokud chybí lokalizovaný soubor pro daný jazyk."
              - label: "Perex (fallback)"
                name: "summary"
                widget: "text"
                required: false
              - label: "Kategorie"
                name: "category"
                widget: "select"
                options: ["theatre","concert","festival","sport"]
                default: "theatre"

  # —— Lokalizovaný obsah průvodců ——
  - name: "microguides"
    label: "Micro-guides (lokalizace)"
    label_singular: "Micro-guide (jazyk)"
    folder: "content/microguides"
    create: true
    format: json
    identifier_field: "title"
    slug: "{{fields.slug}}.{{fields.lang}}"     # výsledný název souboru, např. fees-refund.cs.json
    # POZOR: žádné 'path:' zde – 'folder' už určuje cestu. Soubor skončí v content/microguides/.
    sortable_fields: ["slug", "lang", "title"]
    search_fields: ["slug", "title", "summary"]
    fields:
      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "musí sedět s položkou v indexu (např. seating-map)"
        pattern: ['^[a-z0-9-]+$', 'pouze malá písmena a pomlčky']
      - label: "Jazyk"
        name: "lang"
        widget: "select"
        options: ["cs","en","de","sk","pl","hu"]
        default: "cs"
      - { label: "Titulek", name: "title", widget: "string" }
      - { label: "Perex", name: "summary", widget: "text" }
      - label: "Čas čtení (min)"
        name: "readingMinutes"
        widget: "number"
        min: 1
        max: 30
        default: 5
      - label: "Cover obrázek"
        name: "cover"
        widget: "image"
        allow_multiple: false
        choose_url: true
        hint: "Můžeš vložit URL (např. /images/microguides/slug/cover.webp) nebo nahrát soubor."
      - { label: "Cover alt", name: "coverAlt", widget: "string", required: false }
      - label: "Kategorie"
        name: "category"
        widget: "select"
        options: ["theatre","concert","festival","sport"]
        default: "theatre"

      - label: "Kroky (kapitoly)"
        name: "steps"
        widget: "list"
        label_singular: "Kapitola"
        summary: "{{fields.heading}}"
        fields:
          - label: "ID"
            name: "id"
            widget: "string"
            hint: "např. intro, s1, s2 … používá se v kotvách (#id)"
            pattern: ['^[a-z0-9-]+$', 'malá písmena/čísla/pomlčky']
          - { label: "Nadpis", name: "heading", widget: "string" }
          - label: "Text"
            name: "body"
            widget: "markdown"
            hint: "Podporuje **tučně**, *kurzíva*, seznamy."
          - { label: "Obrázek", name: "image", widget: "image", required: false, choose_url: true }
          - { label: "Alt", name: "alt", widget: "string", required: false }

      - { label: "Závěrečná otázka/CTA", name: "ctaQuestion", widget: "string", required: false }
      - { label: "Status", name: "status", widget: "select", options: ["draft","published"], default: "published" }


  # ?? Reviews ??
  - name: "reviews"
    label: "Reviews"
    label_singular: "Review"
    description: "Edit review content here. Publishing and unpublishing are handled only through the validated AJSEE publication commands."
    folder: "content/reviews/items"
    create: true
    publish: false
    delete: false
    format: json
    identifier_field: "showTitle"
    slug: "{{fields.slug}}"
    sortable_fields: ["reviewDate", "publishedAt", "showTitle", "status"]
    search_fields: ["slug", "showTitle", "venue", "city", "translations.en.title"]
    editor:
      preview: false
    fields:
      - label: "Review slug"
        name: "slug"
        widget: "string"
        hint: "Example: jesus-christ-superstar-london-2026. Use lowercase letters, numbers and hyphens only."
        pattern: ['^[a-z0-9-]+$', 'Use lowercase letters, numbers and hyphens only.']

      - label: "Workflow status — managed automatically"
        name: "status"
        widget: "hidden"
        default: "draft"

      - label: "Published on website — managed automatically"
        name: "published"
        widget: "hidden"
        default: false

      - label: "Featured review"
        name: "featured"
        widget: "boolean"
        default: false
        required: false

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Theatre", value: "theatre" }
          - { label: "Concert", value: "concert" }
          - { label: "Festival", value: "festival" }
          - { label: "Sport", value: "sport" }
        default: "theatre"

      - label: "Show title"
        name: "showTitle"
        widget: "string"
        hint: "Example: Jesus Christ Superstar"

      - label: "Production / event title"
        name: "productionTitle"
        widget: "string"
        required: false

      - label: "Venue"
        name: "venue"
        widget: "string"
        required: false
        hint: "Example: London Palladium"

      - label: "City"
        name: "city"
        widget: "string"
        hint: "Example: London"

      - label: "Country"
        name: "country"
        widget: "string"
        hint: "Example: United Kingdom"

      - label: "Performance date"
        name: "performanceDate"
        widget: "datetime"
        required: false
        picker_utc: true
        format: "YYYY-MM-DDTHH:mm:ss[Z]"

      - label: "Review date"
        name: "reviewDate"
        widget: "datetime"
        required: true
        picker_utc: true
        format: "YYYY-MM-DDTHH:mm:ss[Z]"

      - label: "Published date — managed automatically"
        name: "publishedAt"
        widget: "hidden"
        default: ""

      - label: "Author name"
        name: "author"
        widget: "string"
        hint: "Example: Oya Canli"

      - label: "Rating"
        name: "rating"
        widget: "number"
        required: false
        value_type: "float"
        min: 0
        max: 5
        step: 0.5

      - label: "Ticket URL"
        name: "ticketUrl"
        widget: "string"
        required: false

      - label: "Cover image"
        name: "cover"
        widget: "image"
        allow_multiple: false
        choose_url: true
        required: true
        hint: "Main image used on the review card and detail page."

      - label: "Cover image alt text"
        name: "coverAlt"
        widget: "string"
        required: true
        hint: "Describe the image for accessibility."

      - label: "Cover image photo credit"
        name: "coverCredit"
        widget: "string"
        required: false
        hint: "Example: Photo: Oya Canli"

      - label: "Gallery images"
        name: "gallery"
        widget: "list"
        required: false
        label_singular: "Gallery image"
        summary: "{{fields.image}}"
        fields:
          - label: "Image"
            name: "image"
            widget: "image"
            choose_url: true
          - label: "Alt text"
            name: "alt"
            widget: "string"
            required: true
          - label: "Photo credit"
            name: "credit"
            widget: "string"
            required: false

      - label: "Translations"
        name: "translations"
        widget: "object"
        fields:
          - label: "English content"
            name: "en"
            widget: "object"
            fields:
              - { label: "Review title", name: "title", widget: "string", required: true }
              - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
              - label: "Short excerpt"
                name: "excerpt"
                widget: "text"
                required: true
                hint: "2?3 sentences for the review card and intro."
              - label: "Full review text"
                name: "body"
                widget: "markdown"
                required: true
                hint: "Paste the full English review here."
              - { label: "Call-to-action text", name: "ctaText", widget: "string", required: false, default: "Check tickets" }
              - { label: "SEO title", name: "seoTitle", widget: "string", required: true }
              - { label: "SEO description", name: "seoDescription", widget: "text", required: true }

          - label: "Czech content"
            name: "cs"
            widget: "object"
            required: false
            fields:
              - { label: "Review title", name: "title", widget: "string", required: false }
              - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
              - { label: "Short excerpt", name: "excerpt", widget: "text", required: false }
              - { label: "Full review text", name: "body", widget: "markdown", required: false }
              - { label: "Call-to-action text", name: "ctaText", widget: "string", required: false }
              - { label: "SEO title", name: "seoTitle", widget: "string", required: false }
              - { label: "SEO description", name: "seoDescription", widget: "text", required: false }

          - label: "Slovak content"
            name: "sk"
            widget: "object"
            required: false
            fields:
              - { label: "Review title", name: "title", widget: "string", required: false }
              - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
              - { label: "Short excerpt", name: "excerpt", widget: "text", required: false }
              - { label: "Full review text", name: "body", widget: "markdown", required: false }
              - { label: "Call-to-action text", name: "ctaText", widget: "string", required: false }
              - { label: "SEO title", name: "seoTitle", widget: "string", required: false }
              - { label: "SEO description", name: "seoDescription", widget: "text", required: false }

          - label: "Hungarian content"
            name: "hu"
            widget: "object"
            required: false
            fields:
              - { label: "Review title", name: "title", widget: "string", required: false }
              - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
              - { label: "Short excerpt", name: "excerpt", widget: "text", required: false }
              - { label: "Full review text", name: "body", widget: "markdown", required: false }
              - { label: "Call-to-action text", name: "ctaText", widget: "string", required: false }
              - { label: "SEO title", name: "seoTitle", widget: "string", required: false }
              - { label: "SEO description", name: "seoDescription", widget: "text", required: false }

          - label: "Polish content"
            name: "pl"
            widget: "object"
            required: false
            fields:
              - { label: "Review title", name: "title", widget: "string", required: false }
              - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
              - { label: "Short excerpt", name: "excerpt", widget: "text", required: false }
              - { label: "Full review text", name: "body", widget: "markdown", required: false }
              - { label: "Call-to-action text", name: "ctaText", widget: "string", required: false }
              - { label: "SEO title", name: "seoTitle", widget: "string", required: false }
              - { label: "SEO description", name: "seoDescription", widget: "text", required: false }

          - label: "German content"
            name: "de"
            widget: "object"
            required: false
            fields:
              - { label: "Review title", name: "title", widget: "string", required: false }
              - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
              - { label: "Short excerpt", name: "excerpt", widget: "text", required: false }
              - { label: "Full review text", name: "body", widget: "markdown", required: false }
              - { label: "Call-to-action text", name: "ctaText", widget: "string", required: false }
              - { label: "SEO title", name: "seoTitle", widget: "string", required: false }
              - { label: "SEO description", name: "seoDescription", widget: "text", required: false }

      - label: "Internal notes"
        name: "internalNotes"
        widget: "text"
        required: false
        hint: "Private editorial notes. Not shown on the website."

  # Incoming reviews submitted through /review-admin/
  - name: "review_submissions"
    label: "Incoming review submissions"
    label_singular: "Incoming review submission"
    description: "Review requests submitted by Oya. Publishing here only accepts the submission into the AJSEE internal review queue; it does not publish the review on the public website."
    folder: "content/reviews/submissions"
    create: false
    publish: true
    delete: false
    format: json
    identifier_field: "showTitle"
    slug: "{{slug}}"
    sortable_fields: ["submittedAt", "showTitle", "status"]
    search_fields:
      - "showTitle"
      - "productionTitle"
      - "venue"
      - "city"
      - "english.title"
    editor:
      preview: false

    fields:
      - label: "Review slug"
        name: "slug"
        widget: "hidden"
        required: false

      - label: "Submission status"
        name: "status"
        widget: "hidden"
        default: "ready_for_adam_review"

      - label: "Show title"
        name: "showTitle"
        widget: "string"
        hint: "Example: Sweeney Todd"

      - label: "Production / event title"
        name: "productionTitle"
        widget: "string"
        required: false
        hint: "Optional. Complete only when the production title differs from the show title."

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Theatre", value: "theatre" }
          - { label: "Concert", value: "concert" }
          - { label: "Festival", value: "festival" }
          - { label: "Sport", value: "sport" }
        default: "theatre"

      - label: "Venue"
        name: "venue"
        widget: "string"
        required: false
        hint: "Example: London Palladium"

      - label: "City"
        name: "city"
        widget: "string"
        required: false
        hint: "Example: London"

      - label: "Country"
        name: "country"
        widget: "string"
        required: false
        hint: "Example: United Kingdom"

      - label: "Performance date"
        name: "performanceDate"
        widget: "datetime"
        required: false
        picker_utc: true
        format: "YYYY-MM-DDTHH:mm:ss[Z]"

      - label: "Submission date"
        name: "submittedAt"
        widget: "datetime"
        required: true
        default: "{{now}}"
        picker_utc: true
        format: "YYYY-MM-DDTHH:mm:ss[Z]"
        hint: "Filled automatically. You normally do not need to change it."

      - label: "Author name"
        name: "author"
        widget: "string"
        default: "Oya Canli"

      - label: "Rating"
        name: "rating"
        widget: "number"
        required: false
        value_type: "float"
        min: 0
        max: 5
        step: 0.5
        hint: "Optional. Use a value from 0 to 5."

      - label: "Ticket URL"
        name: "ticketUrl"
        widget: "string"
        required: false
        hint: "Optional. Adam can add the verified AJSEE ticket link later."

      - label: "Photos"
        name: "photos"
        widget: "object"
        required: false
        collapsed: true
        summary: "Optional photographs"
        fields:
          - label: "Cover image"
            name: "cover"
            widget: "image"
            allow_multiple: false
            choose_url: true
            required: false
            hint: "Optional. The review can be submitted without a photograph."

          - label: "Cover image alt text"
            name: "coverAlt"
            widget: "string"
            required: false
            hint: "Optional at submission stage. Adam can complete it later."

          - label: "Gallery images"
            name: "gallery"
            widget: "list"
            required: false
            default: []
            label_singular: "Gallery image"
            summary: "{{fields.image}}"
            fields:
              - label: "Image"
                name: "image"
                widget: "image"
                choose_url: true
                required: false

              - label: "Alt text"
                name: "alt"
                widget: "string"
                required: false

              - label: "Photo credit"
                name: "credit"
                widget: "string"
                required: false

      - label: "English review"
        name: "english"
        widget: "object"
        fields:
          - label: "Review title"
            name: "title"
            widget: "string"
            required: true

          - label: "Subtitle"
            name: "subtitle"
            widget: "string"
            required: false

          - label: "Short excerpt"
            name: "excerpt"
            widget: "text"
            required: false
            hint: "Optional. Adam can prepare the final card excerpt later."

          - label: "Full review text"
            name: "body"
            widget: "markdown"
            required: true
            hint: "Paste the complete English review here. Paragraphs, headings and lists are supported."
            buttons:
              - bold
              - italic
              - link
              - heading-two
              - heading-three
              - quote
              - bulleted-list
              - numbered-list
            editor_components: []

          - label: "Call-to-action text"
            name: "ctaText"
            widget: "string"
            required: false
            default: "Check tickets"

      - label: "SEO"
        name: "seo"
        widget: "object"
        required: false
        collapsed: true
        summary: "Optional — Adam can complete this section"
        fields:
          - label: "SEO title"
            name: "title"
            widget: "string"
            required: false

          - label: "SEO description"
            name: "description"
            widget: "text"
            required: false

      - label: "Notes for Adam"
        name: "notesForAdam"
        widget: "text"
        required: false
        hint: "Optional private notes. These are not shown on the AJSEE website."
