<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Ubytování AJSEE — návrh</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf1ef;color:#173b46;font:14px/1.45 system-ui,sans-serif}
.preview-toolbar{padding:16px 24px;background:#fff;border-bottom:1px solid #dbe5e3;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.preview-title{display:flex;align-items:center;gap:12px;font-weight:650;letter-spacing:.01em}
.preview-title span{font-weight:400;color:#687b80;font-size:12px}
.preview-controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.preview-group{display:flex;padding:3px;background:#f0f5f2;border-radius:9px;gap:3px}
.preview-group button{border:0;background:transparent;color:#47616a;font:500 13px/1.4 system-ui;padding:8px 13px;border-radius:6px;cursor:pointer}
.preview-group button[aria-pressed=true]{background:#173b46;color:white}
button:focus-visible,a:focus-visible{outline:3px solid #087c7b;outline-offset:3px}
.preview-link{color:#087c7b;text-decoration:none;font-size:13px}
.preview-stage{padding:25px 20px 18px;overflow:auto;display:grid;justify-items:center;gap:12px}
.preview-stage iframe{display:block;flex:none;border:1px solid #cad8d4;background:#fafbf8;max-width:none;box-shadow:0 10px 40px #14303e12;border-radius:11px;width:1200px;height:calc(100dvh - 149px)}
.preview-info{color:#5e737a;font-size:12px;text-align:center}
@media(max-width:700px){.preview-toolbar{padding:13px 16px;gap:12px}.preview-title{width:100%}.preview-controls{gap:10px}.preview-group button{padding:7px 10px}.preview-stage{padding:15px 10px}.preview-stage iframe{height:calc(100dvh - 200px)}}
</style>
</head>
<body>
<header class="preview-toolbar">
 <div class="preview-title">AJSEE · Ubytování <span>Návrh stránky</span></div>
 <div class="preview-controls">
  <div class="preview-group" aria-label="Velikost náhledu">
   <button type="button" data-width="1200" aria-pressed="true">Desktop</button>
   <button type="button" data-width="1024" aria-pressed="false">Notebook</button>
   <button type="button" data-width="390" aria-pressed="false">Mobil</button>
  </div>
  <div class="preview-group" aria-label="Barevný režim">
   <button type="button" data-theme="light" aria-pressed="true">Světlý</button>
   <button type="button" data-theme="dark" aria-pressed="false">Tmavý</button>
  </div>
  <a class="preview-link" href="/accommodation/">Otevřít celou stránku ↗</a>
 </div>
</header>
<main class="preview-stage">
 <iframe id="accommodation-frame" title="Náhled stránky Ubytování AJSEE" src="/accommodation/"></iframe>
 <div class="preview-info" id="preview-info">Desktop · 1200 px · světlý režim</div>
</main>
<script>
(() => {
 const frame=document.getElementById('accommodation-frame');
 const params=new URLSearchParams(location.search);
 let width=[1200,1024,390].includes(Number(params.get('width')))?Number(params.get('width')):1200;
 let theme=params.get('theme')==='dark'?'dark':'light';
 const update=()=>{
  frame.style.width=width+'px';
  const label=width===390?'Mobil':width===1024?'Notebook':'Desktop';
  document.querySelectorAll('[data-width]').forEach(btn=>btn.setAttribute('aria-pressed',String(Number(btn.dataset.width)===width)));
  document.querySelectorAll('[data-theme]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.theme===theme)));
  if(frame.contentDocument?.body)frame.contentDocument.body.dataset.acPreviewTheme=theme;
  document.getElementById('preview-info').textContent=label+' · '+width+' px · '+(theme==='dark'?'tmavý':'světlý')+' režim';
  const url=new URL(location.href);url.searchParams.set('width',String(width));url.searchParams.set('theme',theme);history.replaceState(null,'',url);
 };
 frame.addEventListener('load',update);
 document.querySelectorAll('[data-width]').forEach(btn=>btn.addEventListener('click',()=>{width=Number(btn.dataset.width);update()}));
 document.querySelectorAll('[data-theme]').forEach(btn=>btn.addEventListener('click',()=>{theme=btn.dataset.theme;update()}));
 update();
})();
</script>
</body>
</html>
