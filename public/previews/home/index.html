<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>AJSEE · Homepage — náhled</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eaf0ed;color:#14303e;font:14px Inter,system-ui,sans-serif}.review-bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:15px 24px;background:#fafbf8;border-bottom:1px solid #dbe5e3}.review-title{font-size:15px;font-weight:700}.review-title small{display:block;margin-top:4px;font-size:11px;font-weight:400;color:#60767d}.controls{display:flex;gap:12px;flex-wrap:wrap}.group{display:flex;gap:4px;padding:4px;border:1px solid #dbe5e3;border-radius:11px;background:#f0f5f2}button{font:inherit;font-size:12px;cursor:pointer;border:0;border-radius:7px;padding:9px 12px;background:transparent;color:#506571}button[aria-pressed=true]{background:#153b47;color:white}.open-link{font-size:12px;font-weight:600;color:#087c7b;text-decoration:none}.review-stage{padding:25px 24px 40px}.frame-wrap{position:relative;margin:auto;border-radius:12px;overflow:hidden;box-shadow:0 16px 48px #14303e20;background:white;border:1px solid #dbe5e3}iframe{display:block;transform-origin:top left;border:0;background:#fafbf8}.review-note{text-align:center;margin:15px 0 0;color:#60767d;font-size:11px;line-height:1.6}@media(max-width:700px){.review-bar{padding:12px 14px}.review-stage{padding:16px 10px}.group button{padding:8px}.controls{gap:6px}}
</style>
</head>
<body>
<header class="review-bar">
  <div class="review-title">AJSEE · Nová homepage<small>Náhled před nasazením</small></div>
  <div class="controls">
    <div class="group" aria-label="Velikost obrazovky"><button data-width="1440" aria-pressed="true">Velký monitor</button><button data-width="1024" aria-pressed="false">Notebook</button><button data-width="390" aria-pressed="false">Mobil</button></div>
    <div class="group" aria-label="Barevný režim"><button data-theme="light" aria-pressed="true">Světlý</button><button data-theme="dark" aria-pressed="false">Tmavý</button></div>
  </div>
  <a class="open-link" href="/" target="_blank" rel="noopener">Otevřít samostatně ↗</a>
</header>
<main class="review-stage"><div class="frame-wrap"><iframe id="home-frame" src="/" title="Náhled nové homepage AJSEE"></iframe></div><p class="review-note">Stránku posouvejte uvnitř náhledu. Nahoře můžete přepnout velikost obrazovky a barevný režim.</p></main>
<script>
const params=new URLSearchParams(location.search);
let width=[1440,1024,390].includes(Number(params.get('width')))?Number(params.get('width')):1440;
let theme=params.get('theme')==='dark'?'dark':'light';
const frame=document.querySelector('#home-frame'),wrap=document.querySelector('.frame-wrap');
function themeFrame(){
  const d=frame.contentDocument;if(!d?.head)return;
  let style=d.querySelector('#homepage-preview-theme');
  if(!style){style=d.createElement('link');style.id='homepage-preview-theme';style.rel='stylesheet';d.head.append(style)}
  style.href='/previews/home/forced-'+theme+'.css';
}
function render(){
  const height=width===390?844:width===1024?768:900;
  const scale=Math.min(1,(document.querySelector('.review-stage').clientWidth-(innerWidth<700?20:48))/width);
  frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform='scale('+scale+')';
  wrap.style.width=width*scale+'px';wrap.style.height=height*scale+'px';
  document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.width)===width)));
  document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===theme)));
  const p=new URLSearchParams({width:String(width),theme});history.replaceState(null,'',location.pathname+'?'+p);
  themeFrame();
}
document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{width=Number(b.dataset.width);render()}));
document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{theme=b.dataset.theme;render()}));
frame.addEventListener('load',themeFrame);window.addEventListener('resize',render);render();
</script>
</body>
</html>
