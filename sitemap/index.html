<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n-key="sitemap.seo-title">Mapa webu | AJSEE</title>
  <meta name="description" data-i18n-content="sitemap.description" content="Přehled stránek AJSEE. Najděte koncerty, festivaly, divadlo, sport, londýnské muzikály, recenze, průvodce a ubytování.">
  <link rel="canonical" href="https://ajsee.cz/sitemap/">
  <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="cs_CZ">
  <meta property="og:site_name" content="AJSEE">
  <meta property="og:title" data-i18n-content="sitemap.seo-title" content="Mapa webu | AJSEE">
  <meta property="og:description" data-i18n-content="sitemap.description" content="Přehled stránek AJSEE. Najděte koncerty, festivaly, divadlo, sport, londýnské muzikály, recenze, průvodce a ubytování.">
  <meta property="og:url" content="https://ajsee.cz/sitemap/">
  <meta property="og:image" content="https://ajsee.cz/images/logo-ajsee.png">

  <link rel="stylesheet" href="/src/styles/pages/sitemap.scss">
  <script type="module" src="/src/sitemap-entry.js"></script>
</head>
<body data-page="sitemap">
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo-link" aria-label="AJSEE – úvodní stránka" data-i18n-aria="nav-logo-home">
        <img src="/images/logo-ajsee-header.png" alt="AJSEE Logo" class="logo" width="64" height="56" loading="eager" decoding="async" />
      </a>

      <button class="hamburger-btn" id="hamburger" aria-controls="mainNav" aria-expanded="false" aria-label="Otevřít menu" data-i18n-aria="nav-open-menu" type="button">
        <span></span><span></span><span></span>
      </button>

      <nav class="main-nav" id="mainNav" role="navigation" aria-label="Hlavní menu" data-i18n-aria="nav-main-label">
        <button class="menu-close" aria-label="Zavřít menu" data-i18n-aria="nav-close-menu" type="button">&times;</button>

        <ul>
        <!-- site-menu -->
        </ul>

        <div class="language-switcher mobile-switcher" aria-label="Jazyk" data-i18n-aria="sitemap.language">
          <details class="lang-dropdown" id="langDropdownMobile">
            <summary class="lang-current" aria-label="Změnit jazyk" data-i18n-aria="sitemap.change-language">
              <img class="lang-current-flag" src="/images/flags/cz.svg" alt="Čeština" width="22" height="16"/>
              <span class="lang-current-label">Čeština</span>
              <span class="lang-caret" aria-hidden="true">▾</span>
            </summary>

            <div class="lang-menu" role="listbox" aria-label="Vyberte jazyk" data-i18n-aria="sitemap.choose-language">
              <button class="lang-btn" type="button" data-lang="cs" aria-label="Čeština">
                <img src="/images/flags/cz.svg" alt="Čeština" width="22" height="16"/> Čeština
              </button>
              <button class="lang-btn" type="button" data-lang="en" aria-label="English">
                <img src="/images/flags/gb.svg" alt="English" width="22" height="16"/> English
              </button>
              <button class="lang-btn" type="button" data-lang="de" aria-label="Deutsch">
                <img src="/images/flags/de.svg" alt="Deutsch" width="22" height="16"/> Deutsch
              </button>
              <button class="lang-btn" type="button" data-lang="sk" aria-label="Slovenčina">
                <img src="/images/flags/sk.svg" alt="Slovenčina" width="22" height="16"/> Slovenčina
              </button>
              <button class="lang-btn" type="button" data-lang="pl" aria-label="Polski">
                <img src="/images/flags/pl.svg" alt="Polski" width="22" height="16"/> Polski
              </button>
              <button class="lang-btn" type="button" data-lang="hu" aria-label="Magyar">
                <img src="/images/flags/hu.svg" alt="Magyar" width="22" height="16"/> Magyar
              </button>
            </div>
          </details>
        </div>
      </nav>

      <div class="language-switcher desktop-switcher" aria-label="Jazyk" data-i18n-aria="sitemap.language">
        <details class="lang-dropdown" id="langDropdownDesktop">
          <summary class="lang-current" aria-label="Změnit jazyk" data-i18n-aria="sitemap.change-language">
            <img class="lang-current-flag" src="/images/flags/cz.svg" alt="Čeština" width="22" height="16"/>
            <span class="lang-current-label">Čeština</span>
            <span class="lang-caret" aria-hidden="true">▾</span>
          </summary>

          <div class="lang-menu" role="listbox" aria-label="Vyberte jazyk" data-i18n-aria="sitemap.choose-language">
            <button class="lang-btn" type="button" data-lang="cs" aria-label="Čeština">
              <img src="/images/flags/cz.svg" alt="Čeština" width="22" height="16"/> Čeština
            </button>
            <button class="lang-btn" type="button" data-lang="en" aria-label="English">
              <img src="/images/flags/gb.svg" alt="English" width="22" height="16"/> English
            </button>
            <button class="lang-btn" type="button" data-lang="de" aria-label="Deutsch">
              <img src="/images/flags/de.svg" alt="Deutsch" width="22" height="16"/> Deutsch
            </button>
            <button class="lang-btn" type="button" data-lang="sk" aria-label="Slovenčina">
              <img src="/images/flags/sk.svg" alt="Slovenčina" width="22" height="16"/> Slovenčina
            </button>
            <button class="lang-btn" type="button" data-lang="pl" aria-label="Polski">
              <img src="/images/flags/pl.svg" alt="Polski" width="22" height="16"/> Polski
            </button>
            <button class="lang-btn" type="button" data-lang="hu" aria-label="Magyar">
              <img src="/images/flags/hu.svg" alt="Magyar" width="22" height="16"/> Magyar
            </button>
          </div>
        </details>
      </div>

      <div class="menu-overlay-bg" aria-hidden="true"></div>
    </div>
  </header>

  <main id="main" class="sitemap-page">
    <h1 data-i18n-key="footer-sitemap">Mapa webu</h1>

    <div class="sitemap-sections">
      <section aria-labelledby="sitemap-events">
        <h2 id="sitemap-events" data-i18n-key="nav-events">Události</h2>
        <ul>
          <li><a href="/events" data-i18n-key="sitemap.all-events">Všechny události</a></li>
          <li><a href="/events?segment=concert" data-i18n-key="category-concert">Koncerty</a></li>
          <li><a href="/events?segment=festival" data-i18n-key="category-festival">Festivaly</a></li>
          <li><a href="/events?segment=theatre" data-i18n-key="category-theatre">Divadlo</a></li>
          <li><a href="/events?segment=sport" data-i18n-key="category-sport">Sport</a></li>
        </ul>
      </section>

      <section aria-labelledby="sitemap-explore">
        <h2 id="sitemap-explore" data-i18n-key="sitemap.explore">Kultura a cestování</h2>
        <ul>
          <li><a href="/londynske-muzikaly/" data-i18n-key="nav-london-musicals">Muzikály v Londýně</a></li>
          <li><a href="/blog" data-i18n-key="nav-reviews">Recenze a tipy</a></li>
          <li><a href="/microguides/" data-i18n-key="sitemap.guides">Průvodce</a></li>
          <li><a href="/accommodation" data-i18n-key="nav-accommodation">Ubytování</a></li>
        </ul>
      </section>

      <section aria-labelledby="sitemap-about">
        <h2 id="sitemap-about" data-i18n-key="sitemap.about">Informace o AJSEE</h2>
        <ul>
          <li><a href="/about" data-i18n-key="nav-about">O nás</a></li>
          <li><a href="/faq" data-i18n-key="footer-faq">Časté dotazy</a></li>
          <li><a href="/partners" data-i18n-key="nav-partners">Pro partnery</a></li>
          <li><a href="/#contact" data-i18n-key="nav-contact">Kontakt</a></li>
        </ul>
      </section>
    </div>
  </main>

  <!-- site-footer -->
</body>
</html>
